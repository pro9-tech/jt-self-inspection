<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--jt-color-bg-container);font:var(--jt-type-body)}</style><style>.g{display:grid;grid-template-columns:1fr 1fr;gap:20px}h4{font:var(--jt-fw-semibold) var(--jt-fs-sm)/1.4 var(--jt-font-base);color:var(--jt-color-text-secondary);margin:0 0 8px}table{width:100%;border:1px solid var(--jt-color-border);border-radius:var(--jt-r-md);overflow:hidden}td,th{border-bottom:1px solid var(--jt-color-split);text-align:left;font-size:var(--jt-density-fs-base);padding:var(--jt-cell-pad-y) var(--jt-cell-pad-x);line-height:var(--jt-density-lh)}th{background:var(--jt-neutral-50);font-weight:var(--jt-fw-semibold);font-size:var(--jt-density-fs-sm);color:var(--jt-color-text-secondary)}</style></head><body>
<div class="g">
<div><h4>기본 · 36px / 14px / 12·8 padding</h4><table><tr><th>원료</th><th>함량</th></tr><tr><td>Niacinamide</td><td>5.00 %</td></tr><tr><td>Adenosine</td><td>0.04 %</td></tr></table></div>
<div data-density="compact"><h4>컴팩트 · 30px / 13px / 10·5 padding</h4><table><tr><th>원료</th><th>함량</th></tr><tr><td>Niacinamide</td><td>5.00 %</td></tr><tr><td>Adenosine</td><td>0.04 %</td></tr></table></div>
</div>
</body></html>
