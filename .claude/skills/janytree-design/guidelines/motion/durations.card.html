<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--jt-color-bg-container);font:var(--jt-type-body)}</style><style>.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.i{display:flex;flex-direction:column;gap:6px}.bar{height:6px;border-radius:var(--jt-r-full);background:var(--jt-color-accent);animation:jt-w 2.4s var(--jt-ease-standard) infinite alternate}@keyframes jt-w{from{width:8%}to{width:100%}}.n{font:var(--jt-fw-medium) var(--jt-fs-xs)/1.3 var(--jt-font-base)}.v{font:var(--jt-type-caption);color:var(--jt-color-text-tertiary)}</style></head><body>
<div class="g">
<div class="i"><span class="bar" style="animation-duration:1.2s"></span><span class="n">instant · 100ms</span><span class="v">체크·토글</span></div><div class="i"><span class="bar" style="animation-duration:1.6s"></span><span class="n">fast · 160ms</span><span class="v">호버·포커스</span></div><div class="i"><span class="bar" style="animation-duration:2s"></span><span class="n">base · 240ms</span><span class="v">드롭다운·탭</span></div><div class="i"><span class="bar" style="animation-duration:2.4000000000000004s"></span><span class="n">slow · 360ms</span><span class="v">모달·시트</span></div><div class="i"><span class="bar" style="animation-duration:2.8s"></span><span class="n">page · 480ms</span><span class="v">페이지 전환</span></div>
</div>
<p style="margin-top:14px;font:var(--jt-type-sm);color:var(--jt-color-text-secondary)">Standard <code style="font-family:var(--jt-font-num)">cubic-bezier(.4,0,.2,1)</code>. Decorative animation is not used.</p>
</body></html>
