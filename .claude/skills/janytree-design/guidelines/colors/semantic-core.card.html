<!-- @dsCard group="Colors" viewport="700x150" name="Semantic core" subtitle="blue info · green success · yellow warning · red error, base 500" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--jt-color-bg-container);font:var(--jt-type-body)}</style><style>.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--jt-r-md);border:1px solid rgba(0,0,0,.06)}.n{font:var(--jt-fw-medium) var(--jt-fs-xs)/1.3 var(--jt-font-base);color:var(--jt-color-text)}.v{font:var(--jt-type-caption);color:var(--jt-color-text-tertiary)}</style></head><body>
<div class="row"><div class="sw"><div class="chip" style="background:#305CDE"></div><div class="n">blue-500 · info</div><div class="v">#305CDE</div></div><div class="sw"><div class="chip" style="background:#14A870"></div><div class="n">green-500 · success</div><div class="v">#14A870</div></div><div class="sw"><div class="chip" style="background:#F0B01C"></div><div class="n">yellow-500 · warning</div><div class="v">#F0B01C</div></div><div class="sw"><div class="chip" style="background:#E14B4B"></div><div class="n">red-500 · error</div><div class="v">#E14B4B</div></div></div>
<p style="margin-top:12px;font:var(--jt-type-sm);color:var(--jt-color-text-secondary)">500 is the base. Solid fills step down to 600 for contrast; yellow never takes white text.</p>
</body></html>
