<!-- @dsCard group="Colors" viewport="700x150" name="Status in use" subtitle="Every state is a 50 background with 700/900 text" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--jt-color-bg-container);font:var(--jt-type-body)}</style><style>.wrap{display:flex;flex-wrap:wrap;gap:10px}.t{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:var(--jt-r-sm);font:var(--jt-fw-medium) var(--jt-fs-sm)/1 var(--jt-font-base)}</style></head><body>
<div class="wrap">
<span class="t" style="background:var(--jt-green-50);color:var(--jt-green-700);border:1px solid var(--jt-green-100)">승인</span>
<span class="t" style="background:var(--jt-yellow-50);color:var(--jt-yellow-900);border:1px solid var(--jt-yellow-100)">검토 대기</span>
<span class="t" style="background:var(--jt-red-50);color:var(--jt-red-700);border:1px solid var(--jt-red-100)">규격 초과</span>
<span class="t" style="background:var(--jt-blue-50);color:var(--jt-blue-700);border:1px solid var(--jt-blue-100)">발행됨</span>
<span class="t" style="background:var(--jt-purple-50);color:var(--jt-purple-700);border:1px solid var(--jt-purple-100)">프리미엄</span>
<span class="t" style="background:var(--jt-teal-50);color:var(--jt-teal-700);border:1px solid var(--jt-teal-100)">임상 데이터</span>
<span class="t" style="background:var(--jt-gray-100);color:var(--jt-gray-700);border:1px solid var(--jt-gray-200)">초안</span>
</div>
<p style="margin-top:14px;font:var(--jt-type-sm);color:var(--jt-color-text-secondary)">Solid colour fills are reserved for buttons. Status is always a tinted capsule so warning stays legible.</p>
</body></html>
